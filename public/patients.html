<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bemorlar — CareTrack TYBT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fa-solid fa-hospital"></i></div>
            <div><h2>CareTrack</h2><span>TYBT</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Asosiy menyu</div>
            <a href="dashboard.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Bosh sahifa</span></a>
            <a href="doctors.html"   class="nav-item"><span class="nav-icon"><i class="fa-solid fa-user-doctor"></i></span><span class="nav-label">Shifokorlar</span></a>
            <a href="patients.html"  class="nav-item"><span class="nav-icon"><i class="fa-solid fa-users"></i></span><span class="nav-label">Bemorlar</span></a>
            <a href="illnesses.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-file-medical"></i></span><span class="nav-label">Tashxislar</span></a>
        </nav>
        <button id="theme-toggle" class="theme-toggle-btn"></button>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">Yuklanmoqda...</div>
                    <div class="user-role" id="user-role"></div>
                </div>
            </div>
            <button id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</button>
        </div>
    </aside>

    <div class="main-content">
        <div class="page-header">
            <h1>Bemorlar</h1>
            <button class="btn btn-primary" id="btn-add-patient">+ Bemor qo'shish</button>
        </div>

        <div class="page-body">
            <div class="card">
                <div class="card-header">
                    <div class="search-bar">
                        <div class="search-input-wrap">
                            <span class="search-icon">&#128269;</span>
                            <input type="text" id="search-input"
                                   placeholder="Ism yoki telefon raqam bo'yicha qidirish...">
                        </div>
                        <select id="filter-doctor" style="padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;min-width:170px;flex-shrink:0;">
                            <option value="">Barcha shifokorlar</option>
                        </select>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>To'liq ism</th>
                                <th>Jinsi</th>
                                <th>Yoshi / Tug'ilgan sana</th>
                                <th>Telefon raqam</th>
                                <th>Biriktirilgan shifokor</th>
                                <th>Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="patients-body">
                            <tr><td colspan="7"><div class="spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bemor qo'shish / tahrirlash modali -->
<div class="modal-overlay" id="patient-modal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Bemor qo'shish</h3>
            <button class="modal-close" onclick="closeModal('patient-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="modal-error" class="alert alert-error hidden"></div>
            <form id="patient-form">
                <input type="hidden" id="patient-id">
                <div class="form-group">
                    <label>To'liq ism *</label>
                    <input type="text" id="p-name" placeholder="Ism Familiya" required>
                </div>
                <div class="form-group">
                    <label>Tug'ilgan sana *</label>
                    <input type="date" id="p-dob" required>
                </div>
                <div class="form-group">
                    <label>Jinsi *</label>
                    <select id="p-gender" required>
                        <option value="">Jinsni tanlang</option>
                        <option value="male">Erkak</option>
                        <option value="female">Ayol</option>
                        <option value="other">Boshqa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Telefon raqam</label>
                    <input type="tel" id="p-phone" placeholder="+998 90 000 00 00">
                </div>
                <div class="form-group">
                    <label>Shifokor biriktirish</label>
                    <select id="p-doctor">
                        <option value="">— Shifokor tanlanmagan —</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('patient-modal')">Bekor qilish</button>
            <button class="btn btn-primary" id="btn-save-patient">Saqlash</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="app.js"></script>
<script src="theme.js"></script>
<script>
let currentUser = null;

(async () => {
    currentUser = await requireAuth();
    if (!currentUser) return;
    setSidebarUser(currentUser);
    setActiveNav();
    document.getElementById('btn-logout').addEventListener('click', logout);
    document.getElementById('btn-add-patient').addEventListener('click', () => openAddModal());
    document.getElementById('btn-save-patient').addEventListener('click', savePatient);

    const doctors = await apiFetch('/api/doctors');
    const filterEl = document.getElementById('filter-doctor');
    const modalEl  = document.getElementById('p-doctor');
    doctors.forEach(d => {
        filterEl.innerHTML += `<option value="${d.id}">${d.full_name}</option>`;
        modalEl.innerHTML  += `<option value="${d.id}">${d.full_name} — ${d.specialization}</option>`;
    });

    loadPatients();

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadPatients(), 300);
    });
    document.getElementById('filter-doctor').addEventListener('change', () => loadPatients());
})();

function genderUz(g) {
    return g === 'male' ? 'Erkak' : g === 'female' ? 'Ayol' : 'Boshqa';
}

async function loadPatients() {
    const search   = document.getElementById('search-input').value;
    const doctorId = document.getElementById('filter-doctor').value;
    let url = '/api/patients?';
    if (search)   url += `search=${encodeURIComponent(search)}&`;
    if (doctorId) url += `doctor_id=${doctorId}`;
    showTableSpinner('patients-body');
    try {
        const patients = await apiFetch(url);
        renderPatients(patients);
    } catch (err) {
        showToast('Bemorlarni yuklashda xato: ' + err.message, 'error');
    }
}

function renderPatients(patients) {
    const tbody = document.getElementById('patients-body');
    if (patients.length === 0) { showEmptyState('patients-body', 'Bemorlar topilmadi'); return; }
    tbody.innerHTML = patients.map((p, i) => `
        <tr>
            <td class="text-muted">${i + 1}</td>
            <td><a href="patient-profile.html?id=${p.id}"><strong>${p.full_name}</strong></a></td>
            <td><span class="badge badge-${p.gender}">${genderUz(p.gender)}</span></td>
            <td>${calcAge(p.date_of_birth)} yosh <span class="text-muted">(${formatDate(p.date_of_birth)})</span></td>
            <td>${p.phone || '<span class="text-muted">—</span>'}</td>
            <td>${p.doctor_name
                ? `<strong>${p.doctor_name}</strong><br><span class="text-muted" style="font-size:11px;">${p.specialization || ''}</span>`
                : '<span class="text-muted">Biriktirilmagan</span>'}</td>
            <td class="td-actions">
                <a href="patient-profile.html?id=${p.id}" class="btn btn-secondary btn-sm">Profil</a>
                <button class="btn btn-secondary btn-sm" onclick="openEditModal(${p.id})">Tahrirlash</button>
                ${currentUser && currentUser.role === 'admin'
                    ? `<button class="btn btn-danger btn-sm" onclick="deletePatient(${p.id}, '${p.full_name.replace(/'/g,"\\'")}')">O'chirish</button>`
                    : ''}
            </td>
        </tr>`).join('');
}

function openAddModal() {
    document.getElementById('modal-title').textContent = "Bemor qo'shish";
    document.getElementById('patient-form').reset();
    document.getElementById('patient-id').value = '';
    document.getElementById('modal-error').classList.add('hidden');
    openModal('patient-modal');
}

async function openEditModal(id) {
    try {
        const p = await apiFetch(`/api/patients/${id}`);
        document.getElementById('modal-title').textContent = 'Bemorni tahrirlash';
        document.getElementById('patient-id').value = p.id;
        document.getElementById('p-name').value     = p.full_name;
        document.getElementById('p-dob').value      = p.date_of_birth ? p.date_of_birth.split('T')[0] : '';
        document.getElementById('p-gender').value   = p.gender;
        document.getElementById('p-phone').value    = p.phone || '';
        document.getElementById('p-doctor').value   = p.doctor_id || '';
        document.getElementById('modal-error').classList.add('hidden');
        openModal('patient-modal');
    } catch (err) {
        showToast('Bemorni yuklashda xato: ' + err.message, 'error');
    }
}

async function savePatient() {
    const errorEl = document.getElementById('modal-error');
    errorEl.classList.add('hidden');
    const id   = document.getElementById('patient-id').value;
    const body = {
        full_name:     document.getElementById('p-name').value.trim(),
        date_of_birth: document.getElementById('p-dob').value,
        gender:        document.getElementById('p-gender').value,
        phone:         document.getElementById('p-phone').value.trim(),
        doctor_id:     document.getElementById('p-doctor').value || null
    };
    if (!body.full_name || !body.date_of_birth || !body.gender) {
        errorEl.textContent = "Ism, tug'ilgan sana va jins majburiy maydonlar.";
        errorEl.classList.remove('hidden');
        return;
    }
    try {
        if (id) {
            await apiFetch(`/api/patients/${id}`, { method: 'PUT', body });
            showToast('Bemor muvaffaqiyatli yangilandi');
        } else {
            await apiFetch('/api/patients', { method: 'POST', body });
            showToast("Bemor muvaffaqiyatli qo'shildi");
        }
        closeModal('patient-modal');
        loadPatients();
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
    }
}

async function deletePatient(id, name) {
    if (!confirmDelete(name)) return;
    try {
        await apiFetch(`/api/patients/${id}`, { method: 'DELETE' });
        showToast("Bemor o'chirildi");
        loadPatients();
    } catch (err) {
        showToast("O'chirishda xato: " + err.message, 'error');
    }
}
</script>
</body>
</html>
